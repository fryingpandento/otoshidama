<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お届けものです</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'YuMincho', serif;
        margin: 0;
        overflow: hidden;
    }
    .container { text-align: center; perspective: 1000px; }
    h1 {
        color: #333;
        margin-bottom: 30px;
        font-weight: normal;
        letter-spacing: 0.2em;
        text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }
    
    /* Pochibukuro Body */
    .envelope {
        width: 240px;
        height: 380px;
        background-color: #fdfbf7;
        /* Washi texture effect using gradients */
        background-image:
            radial-gradient(#e6e2d8 1px, transparent 1px),
            linear-gradient(to bottom, #fff 0%, #f7f4ed 100%);
        background-size: 20px 20px, 100% 100%;
        position: relative;
        margin: 0 auto;
        box-shadow: 
            0 2px 5px rgba(0,0,0,0.05),
            0 15px 30px rgba(0,0,0,0.1);
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
        border-radius: 2px;
        overflow: hidden;
    }
    .envelope:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }
    
    /* Flap (Lid) */
    .flap {
        position: absolute;
        top: 0; left: 0;
        width: 0; height: 0;
        border-left: 120px solid transparent;
        border-right: 120px solid transparent;
        border-top: 100px solid #fdfbf7;
        /* Match Washi color closely */
        transform-origin: top;
        transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 20;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.1));
        transform: rotateX(0deg); /* Closed */
    }
    /* Flap texture overlay (pseudo) is hard on border elements, keep simple */
    
    .envelope.open .flap {
        transform: rotateX(180deg);
        opacity: 0; /* Fade out or move behind */
        transition-delay: 0s;
    }
    
    /* Noshi (Right top decoration) */
    .noshi {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 30px;
        height: 45px;
        background: #fff;
        border: 1px solid #ddd;
        z-index: 15;
        box-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        transform: rotate(-5deg);
    }
    /* Red/Gold strip in Noshi */
    .noshi::after {
        content: '';
        position: absolute;
        top: 50%; left: 50%;
        width: 15px; height: 15px;
        background: #d93d3d;
        transform: translate(-50%, -50%) rotate(45deg);
    }
    
    /* Content Area */
    .content-area {
        position: absolute;
        top: 40px; left: 20px; right: 20px; bottom: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 5;
        opacity: 0;
        transition: opacity 0.5s 0.6s;
    }
    .envelope.open .content-area { opacity: 1; pointer-events: auto; }
    
    .message {
        font-size: 1.1rem;
        color: #555;
        margin-bottom: 25px;
        line-height: 1.8;
        font-family: serif;
    }
    
    button.download-btn {
        background: linear-gradient(135deg, #d93d3d, #b52b2b);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 50px;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        letter-spacing: 0.05em;
        box-shadow: 0 4px 10px rgba(217, 61, 61, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
    }
    button.download-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(217, 61, 61, 0.5);
    }
    
    /* Mizuhiki (Gold & Red) */
    .mizuhiki {
        position: absolute;
        top: 45%; left: 0; width: 100%; height: 80px;
        pointer-events: none;
        z-index: 25; /* Above flap initially but flap logic handles z-index */
        transition: opacity 0.4s;
        filter: drop-shadow(0 2px 2px rgba(0,0,0,0.1));
    }
    .envelope.open .mizuhiki { opacity: 0; }
    
    .mizuhiki-line {
        position: absolute; top: 50%; left: 0; right: 0; height: 3px;
        /* Gold and Red lines */
        background: repeating-linear-gradient(
            to bottom,
            #d4af37 0px, #d4af37 1px,
            #fff 1px, #fff 2px,
            #d93d3d 2px, #d93d3d 3px
        );
    }
    
    /* Flower Knot */
    .not-mizu {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 50px; height: 30px;
    }
    .not-mizu::before, .not-mizu::after {
        content: '';
        position: absolute;
        top: -15px;
        width: 24px; height: 24px;
        border: 4px solid;
        border-color: #d93d3d #d4af37 #d93d3d #d4af37; /* Mixed colors */
        border-radius: 50%;
    }
    .not-mizu::before {
        left: 0;
        transform: rotate(-30deg);
        border-bottom-color: transparent;
        border-right-color: transparent;
    }
    .not-mizu::after {
        right: 0;
        transform: rotate(30deg);
        border-bottom-color: transparent;
        border-left-color: transparent;
    }
    
    .hint { margin-top: 40px; color: #999; font-size: 0.85rem; letter-spacing: 0.05em; }
    </style>
</head>
<body>

<div class="container">
    <h1>心ばかりの品です</h1>
    
    <div class="envelope">
        <div class="flap"></div>
        <div class="noshi"></div>
        <div class="mizuhiki">
            <div class="mizuhiki-line"></div>
            <div class="not-mizu"></div>
        </div>
        
        <!-- Content revealed after opening -->
        <div class="content-area">
            <div class="message" id="msg"></div>
            <button id="action-btn" class="download-btn">...</button>
        </div>
    </div>
    
    <p class="hint" id="hint-text">ポチ袋をクリックして開けてください</p>
</div>

<script>

    const envelope = document.querySelector('.envelope');
    const type = 'urls';
    const content = '["https://fryingpandento.github.io/pdf-tools-ver.1.1/", "https://fryingpandento.github.io/drawing-toorism-map-matsu/"]';
    const filename = '';
    
    let isOpened = false;
    
    envelope.addEventListener('click', () => {
        if (isOpened) return;
        isOpened = true;
        
        // Open animation
        envelope.classList.add('open');
        document.getElementById('hint-text').innerText = "中身を確認しています...";
        
        // Wait for animation to finish then act
        setTimeout(() => {
            if (type === 'url') {
                document.getElementById('msg').innerText = "右のボタンから\n移動してください";
                const btn = document.getElementById('action-btn');
                btn.innerText = "ページを開く";
                btn.onclick = (e) => {
                    e.stopPropagation();
                    window.open(content, '_blank');
                };
            } else if (type === 'urls') {
                document.getElementById('msg').innerText = "以下のリンクから\nお選びください";
                const btnContainer = document.querySelector('.content-area');
                const actionBtn = document.getElementById('action-btn');
                actionBtn.style.display = 'none'; // Hide default button
                
                try {
                    const urls = JSON.parse(content);
                    urls.forEach((url, index) => {
                        const newBtn = document.createElement('button');
                        newBtn.className = 'download-btn';
                        newBtn.innerText = `サイト ${index + 1} を開く`;
                        newBtn.style.marginBottom = '12px'; // Add spacing
                        newBtn.style.fontSize = '0.9rem';
                        newBtn.onclick = (e) => {
                            e.stopPropagation();
                            window.open(url, '_blank');
                        };
                        btnContainer.appendChild(newBtn);
                    });
                } catch (e) {
                    console.error("JSON parse error", e);
                    document.getElementById('msg').innerText = "エラーが発生しました";
                }
            } else {
                document.getElementById('msg').innerText = "ダウンロード\n準備完了";
                const btn = document.getElementById('action-btn');
                btn.innerText = "受け取る";
                btn.onclick = (e) => {
                    e.stopPropagation();
                    downloadFile(content, filename);
                };
                
                // Auto trigger download attempt? Maybe too aggressive. Let user click.
            }
        }, 800);
    });
    
    function downloadFile(base64Data, fileName) {
        const byteCharacters = atob(base64Data);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], {type: "application/octet-stream"});
        
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
</script>
</body>
</html>
